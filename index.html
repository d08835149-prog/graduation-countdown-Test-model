<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f101a; 
    --text: #ffffff;
    --muted: #d1d5db;
    --faint: #9ca3af;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* ── Quotes Animation ── */
  .quotes-wrapper {
    position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
    display: flex; justify-content: space-between; pointer-events: none;
    z-index: 0; padding: 5% 3%; overflow: hidden;
  }
  .quote-col { width: 22%; height: 100%; display: flex; flex-direction: column; animation: scroll 80s linear infinite; }
  .quote-item { 
    font-family: 'DM Mono', monospace; 
    font-size: 11px; 
    color: var(--muted); 
    padding: 25px 10px; 
    text-align: center;
    white-space: normal;
    line-height: 1.4;
  }
  @keyframes scroll { from { transform: translateY(-100%); } to { transform: translateY(100%); } }

  /* ── UI ── */
  .page { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
  header { text-align: center; margin-bottom: 3.5rem; }
  .hero { border-radius: 20px; padding: 3rem 2rem; text-align: center; margin-bottom: 2rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
  .hero-number { font-size: clamp(5rem, 18vw, 9rem); font-weight: 800; }
  
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .card { border-radius: 16px; padding: 1.5rem; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); }
  
  /* ── 일렬로 배치된 타이머 ── */
  .timer-row { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
  .t-block { text-align: center; }
  .t-num { font-family: 'DM Mono', monospace; font-size: 1.2rem; font-weight: 600; display: block; }
  .t-unit { font-size: 8px; color: var(--faint); text-transform: uppercase; display: block; }
</style>
</head>
<body>

<div class="quotes-wrapper">
  <div class="quote-col" id="col-left"></div>
  <div class="quote-col" id="col-right"></div>
</div>

<div class="page">
  <header>
    <h1>Almost There.</h1>
  </header>

  <div class="hero">
    <p>🏫 School days remaining</p>
    <div class="hero-number" id="school-num"></div>
  </div>

  <div class="cards">
    <div class="card"><div class="card-title">Graduation Ceremony</div><div id="timer-grad"></div></div>
    <div class="card"><div class="card-title">Graduation Trip</div><div id="timer-trip"></div></div>
    <div class="card"><div class="card-title">Last Day of School</div><div id="timer-last"></div></div>
  </div>
</div>

<script>
const quotes = ["Your life is your story.", "The best time is now", "Not everything is a competition.", "Dream big, work hard.", "Class of 2026"]; // 요약된 리스트
const colLeft = document.getElementById('col-left');
const colRight = document.getElementById('col-right');
quotes.forEach((q, i) => {
  const div = document.createElement('div'); div.className = 'quote-item'; div.textContent = q;
  if (i < quotes.length / 2) colLeft.appendChild(div); else colRight.appendChild(div);
});

const SCHOOL_DATES = ['2026-06-01','2026-06-02','2026-06-03','2026-06-04','2026-06-08','2026-06-09','2026-06-10','2026-06-11','2026-06-12','2026-06-15','2026-06-16','2026-06-17','2026-06-18','2026-06-19','2026-06-22','2026-06-23','2026-06-24','2026-06-25'];
const events = [{ id: 'grad', target: new Date(2026, 5, 15) }, { id: 'trip', target: new Date(2026, 5, 22) }, { id: 'last', target: new Date(2026, 5, 25) }];

function updateTimer() {
  document.getElementById('school-num').textContent = SCHOOL_DATES.filter(d => d >= new Date().toISOString().slice(0, 10)).length;
  events.forEach(e => {
    const ms = e.target - new Date();
    const d = Math.floor(ms / 86400000);
    const h = Math.floor((ms % 86400000) / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const ms2 = Math.floor((ms % 1000) / 10);
    document.getElementById('timer-' + e.id).innerHTML = `
      <div class="timer-row">
        <div class="t-block"><span class="t-num">${d}</span><span class="t-unit">D</span></div>
        <div class="t-block"><span class="t-num">${h}</span><span class="t-unit">H</span></div>
        <div class="t-block"><span class="t-num">${m}</span><span class="t-unit">M</span></div>
        <div class="t-block"><span class="t-num">${s}</span><span class="t-unit">S</span></div>
        <div class="t-block"><span class="t-num">${ms2}</span><span class="t-unit">MS</span></div>
      </div>`;
  });
}
setInterval(updateTimer, 50); updateTimer();
</script>
</body>
</html>
